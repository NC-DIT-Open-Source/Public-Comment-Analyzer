version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    groups:
      python-runtime:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      frontend:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /infrastructure/terraform/docker
    schedule: {interval: weekly}
